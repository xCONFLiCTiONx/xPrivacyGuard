<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>xPrivacyGuard</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #121214;
        --surface: #1a1a1e;
        --surface-2: #222227;
        --border: #2c2c33;
        --border-subtle: #24242b;
        --text: #f4f4f5;
        --text-secondary: #a1a1aa;
        --text-muted: #71717a;
        --accent: #f38020;
        --accent-bright: #faad3f;
        --accent-soft: rgba(243, 128, 32, 0.14);
        --accent-border: rgba(243, 128, 32, 0.4);
        --green: #22c55e;
        --green-bg: #0e2918;
        --green-border: rgba(34, 197, 94, 0.35);
        --red: #ef4444;
        --red-soft: #fca5a5;
        --red-bg: #331417;
        --red-border: rgba(239, 68, 68, 0.4);
      }

      * { box-sizing: border-box; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 12px;
        width: 332px;
        background-color: var(--bg);
        color: var(--text);
        accent-color: var(--accent);
        scrollbar-color: #3f3f46 var(--bg);
      }

      ::selection {
        background: rgba(243, 128, 32, 0.35);
        color: var(--text);
      }

      button:focus-visible,
      select:focus-visible,
      input:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--accent-bright);
        outline-offset: 1px;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
        padding-bottom: 9px;
        border-bottom: 1px solid var(--border);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .brand img {
        width: 22px;
        height: 22px;
        border-radius: 5px;
        display: block;
      }

      .header h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: var(--text);
      }

      .version-pill {
        font-size: 10px;
        background: #2b1b0e;
        color: var(--accent);
        border: 1px solid var(--accent-border);
        padding: 2px 6px;
        border-radius: 4px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 11px;
        margin-bottom: 8px;
      }

      .card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 7px;
      }

      .card-title {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-secondary);
      }

      .domain-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 8px;
      }

      .domain-name {
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }

      .badge {
        font-size: 10px;
        font-weight: 600;
        padding: 2px 7px;
        border-radius: 999px;
        white-space: nowrap;
        flex-shrink: 0;
      }

      .badge-protected {
        background: var(--green-bg);
        color: var(--green);
        border: 1px solid var(--green-border);
      }

      .badge-excluded {
        background: #2b1b0e;
        color: var(--accent-bright);
        border: 1px solid var(--accent-border);
      }

      .badge-disabled {
        background: var(--red-bg);
        color: var(--red);
        border: 1px solid var(--red-border);
      }

      .action-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      button {
        cursor: pointer;
        font-family: inherit;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        padding: 5px 10px;
        height: 29px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        transition: background-color 0.14s, border-color 0.14s, color 0.14s;
      }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .btn-flex {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .btn-primary {
        background: var(--accent);
        color: var(--bg);
        border: 1px solid transparent;
      }

      .btn-primary:hover:not(:disabled) {
        background: var(--accent-bright);
      }

      .btn-amber-soft {
        background: var(--accent-soft);
        color: var(--accent-bright);
        border: 1px solid var(--accent-border);
      }

      .btn-amber-soft:hover:not(:disabled) {
        background: var(--accent);
        color: var(--bg);
        border-color: var(--accent);
      }

      .btn-secondary {
        background: var(--surface-2);
        color: var(--text);
        border: 1px solid var(--border);
      }

      .btn-secondary:hover:not(:disabled) {
        background: #2c2c33;
        border-color: #3a3a44;
      }

      .btn-inline {
        height: 24px;
        padding: 2px 9px;
        font-size: 11px;
        border-radius: 5px;
      }

      .mute-btn {
        flex-shrink: 0;
        padding: 5px 9px;
        background: var(--surface-2);
        color: var(--text-secondary);
        border: 1px solid var(--border);
      }

      .mute-btn:hover:not(:disabled) {
        background: #2c2c33;
        color: var(--text);
      }

      .mute-btn.is-muted {
        background: var(--red-bg);
        border-color: var(--red-border);
        color: var(--red-soft);
      }

      .mute-btn.is-muted:hover:not(:disabled) {
        background: #4c1d22;
        color: #fecaca;
      }

      .mute-btn svg {
        width: 12px;
        height: 12px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        display: block;
      }

      .hint {
        font-size: 10.5px;
        color: var(--text-muted);
        margin-top: 6px;
        line-height: 1.35;
      }

      .filter-stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }

      .filter-stat {
        padding: 6px 4px;
        border-radius: 6px;
        background: var(--bg);
        border: 1px solid var(--border-subtle);
        text-align: center;
      }

      .filter-stat strong {
        display: block;
        font-size: 15px;
        line-height: 1.15;
        font-variant-numeric: tabular-nums;
        color: var(--accent);
      }

      .filter-stat span {
        color: var(--text-secondary);
        font-size: 10px;
      }

      .mode-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .mode-row label {
        font-size: 11px;
        font-weight: 600;
        color: var(--text-secondary);
        white-space: nowrap;
      }

      select {
        flex: 1;
        min-width: 0;
        height: 28px;
        padding: 3px 8px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--bg);
        font-size: 12px;
        color: var(--text);
        font-family: inherit;
      }

      .divider {
        height: 1px;
        background: var(--border-subtle);
        margin: 9px 0;
      }

      .domain-list {
        max-height: 84px;
        overflow-y: auto;
        margin-top: 6px;
        scrollbar-color: #3f3f46 var(--surface);
      }

      .domain-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        background: var(--bg);
        border: 1px solid var(--border-subtle);
        padding: 3px 8px;
        border-radius: 5px;
        margin-bottom: 4px;
        font-size: 11.5px;
        color: var(--text);
      }

      .domain-item span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .domain-item .remove-btn {
        background: none;
        border: none;
        color: var(--text-muted);
        font-weight: 700;
        height: 20px;
        padding: 0 4px;
        font-size: 11px;
        flex-shrink: 0;
      }

      .domain-item .remove-btn:hover {
        color: var(--red);
      }

      .add-domain-box {
        display: flex;
        gap: 6px;
      }

      .add-domain-box input {
        flex: 1;
        min-width: 0;
        height: 28px;
        padding: 4px 8px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        font-size: 11.5px;
        font-family: inherit;
      }

      .add-domain-box input::placeholder {
        color: var(--text-muted);
      }

      .add-domain-box button {
        height: 28px;
        padding: 0 10px;
        font-size: 11.5px;
      }

      .empty-state {
        font-size: 11px;
        color: var(--text-muted);
        font-style: italic;
        padding: 2px 0;
      }

      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid var(--border);
      }

      .footer a {
        color: var(--accent);
        text-decoration: none;
        font-size: 11.5px;
        font-weight: 600;
        padding: 2px 4px;
        border-radius: 4px;
      }

      .footer a:hover {
        color: var(--accent-bright);
        background: var(--accent-soft);
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="brand">
        <img src="icons/icon32.png" alt="xPrivacyGuard Logo" />
        <h1>xPrivacyGuard</h1>
      </div>
      <span class="version-pill">Desktop</span>
    </div>

    <div class="card">
      <div class="card-head">
        <span class="card-title">Current Site</span>
        <span class="badge badge-disabled" id="status-badge">-</span>
      </div>
      <div class="domain-row">
        <span class="domain-name" id="current-domain">Detecting…</span>
      </div>
      <div class="action-row">
        <button id="toggle-exclude-btn" class="btn-secondary btn-flex" type="button" disabled>Detecting tab…</button>
        <button id="site-mute-btn" class="mute-btn" type="button" title="Mute site audio" aria-label="Mute site audio" disabled>
          <span id="mute-icon"></span>
          <span id="mute-label">Mute</span>
        </button>
      </div>
      <div class="hint">Reloads tab when site protection is toggled.</div>
    </div>

    <div class="card">
      <div class="card-head">
        <span class="card-title">Ads &amp; Trackers</span>
        <button id="toggle-filter-site" class="btn-amber-soft btn-inline" type="button" disabled>Detecting…</button>
      </div>
      <div class="filter-stats">
        <div class="filter-stat"><strong id="filter-blocked">0</strong><span>Blocked</span></div>
        <div class="filter-stat"><strong id="filter-cosmetic">0</strong><span>Cosmetic</span></div>
        <div class="filter-stat"><strong id="filter-list-count">0</strong><span>Lists</span></div>
      </div>
      <div class="hint" id="filter-status">Loading filter status…</div>
    </div>

    <div class="card">
      <div class="mode-row">
        <label for="mode-select">Mode</label>
        <select id="mode-select">
          <option value="daily">Daily browsing</option>
          <option value="cautious">Cautious browsing</option>
        </select>
      </div>
      <div class="hint">Cautious adds stricter protections; reload tabs after changing.</div>

      <div class="divider"></div>

      <div class="card-head" style="margin-bottom: 6px;">
        <span class="card-title">Excluded Sites (<span id="excluded-count">0</span>)</span>
      </div>
      <div class="add-domain-box">
        <input type="text" id="new-domain-input" placeholder="Add domain (e.g. example.com)" aria-label="Add excluded domain" />
        <button class="btn-secondary" id="add-domain-btn" type="button">Add</button>
      </div>
      <div class="domain-list" id="excluded-list">
        <div class="empty-state">No excluded sites yet</div>
      </div>
    </div>

    <div class="footer">
      <a href="#" id="open-options-link">Settings</a>
      <a href="#" id="open-diagnostics-link">Diagnostics</a>
      <a href="https://xconflictionx.cc/tools/privacy-test/" target="_blank" rel="noopener noreferrer">Test Page</a>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
